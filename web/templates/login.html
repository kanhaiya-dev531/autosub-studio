{% extends "base.html" %}
{% block title %}Sign in · AutoSub Studio{% endblock %}
{% block content %}
<div class="wrap page">
  <div class="auth">
    <h1>Sign in</h1>
    <p class="muted">Projects you made as a guest on this device move into your account.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}" autofocus></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p class="fine">New here? <a href="{{ url_for('auth.register', next=next) }}">Create an account</a>, or <a href="{{ url_for('pages.dashboard') }}">continue without one</a>.</p>
  </div>
</div>
{% endblock %}
